# Actualiza los datos y el dashboard automáticamente en la nube (GitHub Actions)
name: Actualizar datos y dashboard

on:
  # Todos los días a las 15:00 UTC (10:00 a. m. en Panamá)
  schedule:
    - cron: "0 15 * * *"
  # Permite ejecutarlo a mano desde la pestaña Actions (botón "Run workflow")
  workflow_dispatch:

# Permiso para que el flujo pueda guardar (commit y push) los archivos actualizados
permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      # Para que la hora de "Datos actualizados" sea la de Panamá y no la de Londres (UTC)
      TZ: America/Panama

    steps:
      # 1. Descargar una copia del repositorio en la máquina de GitHub
      - name: Copiar el repositorio
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Instalar las bibliotecas del proyecto
      - name: Instalar bibliotecas
        run: python -m pip install -r requirements.txt

      # 4. Ejecutar todo el flujo: descarga, limpieza, análisis y dashboard
      - name: Ejecutar el flujo completo
        run: python ejecutar_todo.py

      # 5. Guardar los archivos que cambiaron (solo si hubo cambios)
      - name: Guardar los cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos notebooks dashboard
          if git diff --staged --quiet; then
            echo "No hubo cambios en los datos."
          else
            git commit -m "Actualización automática de datos: $(date +'%Y-%m-%d')"
            git push
          fi
